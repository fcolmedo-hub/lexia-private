<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>LexIA Móvil</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#f3f4f6; --panel:#fff; --ink:#111827; --muted:#6b7280;
      --line:#e5e7eb; --brand:#111827; --accent:#2563eb; --danger:#991b1b;
      --ok:#166534; --radius:18px; --shadow:0 14px 32px rgba(15,23,42,.08);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
    body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    .app{width:min(100%,760px);margin:0 auto;padding:14px 12px 96px}
    header{position:sticky;top:0;z-index:10;margin:-14px -12px 12px;padding:calc(14px + env(safe-area-inset-top)) 12px 12px;background:rgba(243,244,246,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(229,231,235,.85)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .brand{display:flex;flex-direction:column;gap:2px}
    .brand h1{margin:0;font-size:21px;line-height:1.1;letter-spacing:-.03em}
    .brand span{font-size:12px;color:var(--muted)}
    .status{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
    .status.ok{color:var(--ok)} .status.bad{color:var(--danger)}
    .search-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px}
    .search-row{display:flex;gap:8px}
    input,select,button,textarea{font:inherit}
    input[type="search"]{width:100%;min-height:46px;border:1px solid var(--line);border-radius:14px;padding:0 13px;font-size:16px;outline:none;background:#fff;color:var(--ink)}
    input[type="search"]:focus,textarea:focus{border-color:rgba(37,99,235,.7);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
    button{min-height:46px;border:0;border-radius:14px;padding:0 15px;font-weight:700;color:#fff;background:var(--brand);cursor:pointer;touch-action:manipulation}
    button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
    button:disabled{opacity:.55;cursor:wait}
    .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .native-filter{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important;overflow:hidden!important}
    .touch-select{position:relative;min-width:0}
    .touch-select-trigger{width:100%;min-height:42px;border:1px solid var(--line);border-radius:13px;padding:0 34px 0 10px;background:#fff;color:var(--ink);font-weight:400;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
    .touch-select-trigger::after{content:"⌄";position:absolute;right:11px;top:50%;transform:translateY(-55%);color:var(--muted);font-size:16px}
    .touch-select-trigger[aria-expanded="true"]{border-color:rgba(37,99,235,.7);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
    .touch-select-menu{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:100;display:none;max-height:220px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:0 16px 36px rgba(15,23,42,.18);padding:5px}
    .touch-select-menu.open{display:block}
    .touch-select-menu button{display:block;width:100%;min-height:42px;padding:9px 10px;border-radius:9px;background:transparent;color:var(--ink);font-weight:500;text-align:left;touch-action:pan-y;user-select:none;-webkit-user-select:none}
    .touch-select-menu button[aria-selected="true"]{background:#eef2ff;color:#1d4ed8;font-weight:700}
    .hint{margin:10px 2px 0;color:var(--muted);font-size:12px;line-height:1.35}
    .summary{margin:14px 4px 8px;color:var(--muted);font-size:13px}
    .results{display:flex;flex-direction:column;gap:10px}
    .result{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px;box-shadow:0 10px 24px rgba(15,23,42,.05)}
    .result h2{margin:0 0 7px;font-size:16px;line-height:1.25;letter-spacing:-.01em;word-break:break-word}
    .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
    .pill{display:inline-flex;align-items:center;min-height:24px;padding:3px 8px;border-radius:999px;background:#f3f4f6;color:#374151;font-size:12px}
    .snippet{margin:0;color:#374151;font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
    .actions button{min-height:40px;font-size:14px;font-weight:650}
    .empty,.error{margin-top:14px;background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);padding:18px;color:var(--muted);line-height:1.45}
    .error{color:var(--danger);border-color:rgba(153,27,27,.35);background:#fff7f7}
    .preview{position:fixed;inset:0;z-index:50;display:none;background:rgba(17,24,39,.54);padding:14px 10px calc(16px + env(safe-area-inset-bottom))}
    .preview.open{display:flex}
    .preview-panel{width:min(100%,780px);max-height:100%;margin:auto;background:var(--panel);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 90px rgba(0,0,0,.28)}
    .preview-head{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid var(--line)}
    .preview-head strong{font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    .preview-body{overflow:auto;padding:14px;font-size:14px;line-height:1.52;white-space:pre-wrap;color:#1f2937;min-height:220px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
    .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,760px);margin:0 auto;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(243,244,246,.94);border-top:1px solid rgba(229,231,235,.9);backdrop-filter:blur(12px)}
    .bottom-nav button{min-height:42px;background:#fff;color:var(--ink);border:1px solid var(--line);font-size:13px}
    @media(prefers-color-scheme:dark){
      :root{--bg:#0b1220;--panel:#111827;--ink:#f9fafb;--muted:#9ca3af;--line:#263244;--brand:#2563eb;--accent:#60a5fa;--shadow:0 14px 32px rgba(0,0,0,.24)}
      input[type="search"],button.secondary,.bottom-nav button,.touch-select-trigger{background:#0f172a;color:var(--ink)}
      .touch-select-menu{background:#111827}.touch-select-menu button[aria-selected="true"]{background:#172554;color:#bfdbfe}
      .pill{background:#0f172a;color:#d1d5db}.snippet,.preview-body{color:#e5e7eb}header,.bottom-nav{background:rgba(11,18,32,.94)}.error{background:#2a1111}
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="topbar">
        <div class="brand"><h1>LexIA Móvil</h1><span>Consulta rápida en red local</span></div>
        <div id="status" class="status">verificando</div>
      </div>
      <section class="search-card" aria-label="Buscar documentos">
        <form id="searchForm">
          <div class="search-row">
            <input id="query" type="search" autocomplete="off" placeholder="Buscar en LexIA…" />
            <button id="searchBtn" type="submit">Buscar</button>
          </div>
          <div class="filters">
            <div class="touch-select" data-select="category">
              <select id="category" class="native-filter" aria-hidden="true" tabindex="-1">
                <option value="">Todas</option>
                <option>Escritos</option><option>Doctrina</option><option>Jurisprudencia</option><option>Legislacion</option><option>Legislación</option>
              </select>
              <button id="categoryTrigger" class="touch-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">Todas</button>
              <div id="categoryMenu" class="touch-select-menu" role="listbox" aria-label="Categoría"></div>
            </div>
            <div class="touch-select" data-select="limit">
              <select id="limit" class="native-filter" aria-hidden="true" tabindex="-1">
                <option value="10">10 resultados</option><option value="20" selected>20 resultados</option><option value="50">50 resultados</option>
              </select>
              <button id="limitTrigger" class="touch-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">20 resultados</button>
              <div id="limitMenu" class="touch-select-menu" role="listbox" aria-label="Cantidad de resultados"></div>
            </div>
          </div>
        </form>
        <div class="hint">Diseñada para lectura y búsqueda rápida. Las tareas pesadas conviene hacerlas desde la interfaz de escritorio.</div>
      </section>
    </header>
    <div id="summary" class="summary"></div>
    <section id="results" class="results"></section>
  </main>
  <nav class="bottom-nav" aria-label="Accesos rápidos">
    <button type="button" id="topBtn">Arriba</button><button type="button" id="healthBtn">Estado</button><button type="button" id="desktopBtn">Escritorio</button>
  </nav>
  <section id="preview" class="preview" aria-hidden="true">
    <div class="preview-panel"><div class="preview-head"><strong id="previewTitle">Vista previa</strong><button class="secondary" id="closePreview" type="button">Cerrar</button></div><div id="previewBody" class="preview-body">Cargando…</div></div>
  </section>
  <script>
    const $=id=>document.getElementById(id);
    const state={lastItems:[]};
    function text(value,fallback=""){if(value===null||value===undefined)return fallback;return String(value)}
    function first(obj,keys,fallback=""){for(const key of keys){if(obj&&obj[key]!==undefined&&obj[key]!==null&&String(obj[key]).trim()!=="")return obj[key]}return fallback}
    function normalizeItems(payload){if(!payload||typeof payload!=="object")return[];const candidates=[payload.results,payload.items,payload.documents,payload.hits,payload.matches];for(const value of candidates){if(Array.isArray(value))return value}if(payload.result&&typeof payload.result==="object")return normalizeItems(payload.result);return[]}
    function itemPath(item){return text(first(item,["document_path","path","file_path","source_path"]))}
    function itemName(item){const p=itemPath(item);return text(first(item,["document_name","name","title","file_name"],p?p.split(/[\\/]/).pop():"Documento"))}
    function itemSnippet(item){return text(first(item,["snippet","text","fragment","content","excerpt","preview"],""))}
    function itemCategory(item){return text(first(item,["category","categoria"],""))}
    function itemPage(item){return text(first(item,["page","page_start","pagina","pageStart"],""))}
    function escapeHtml(value){return text(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
    async function jsonFetch(url,options={}){const response=await fetch(url,{cache:"no-store",headers:{"Content-Type":"application/json",...(options.headers||{})},...options});const data=await response.json().catch(()=>({}));if(!response.ok||data.ok===false)throw new Error(data.error||`HTTP ${response.status}`);return data}

    function setupTouchSelect(selectId,triggerId,menuId){
      const select=$(selectId),trigger=$(triggerId),menu=$(menuId);if(!select||!trigger||!menu)return;
      let startX=0,startY=0,moved=false,suppressClickUntil=0;
      const sync=()=>{
        const option=select.options[select.selectedIndex]||select.options[0];
        trigger.textContent=option?.textContent||"";
        menu.querySelectorAll('button[data-value]').forEach(btn=>btn.setAttribute('aria-selected',btn.dataset.value===select.value?'true':'false'));
      };
      const close=()=>{menu.classList.remove('open');trigger.setAttribute('aria-expanded','false')};
      const open=()=>{
        document.querySelectorAll('.touch-select-menu.open').forEach(other=>{if(other!==menu)other.classList.remove('open')});
        document.querySelectorAll('.touch-select-trigger[aria-expanded="true"]').forEach(other=>{if(other!==trigger)other.setAttribute('aria-expanded','false')});
        menu.classList.add('open');trigger.setAttribute('aria-expanded','true');
        menu.querySelector('[aria-selected="true"]')?.scrollIntoView({block:'nearest'});
      };
      menu.innerHTML='';
      Array.from(select.options).forEach(option=>{
        const btn=document.createElement('button');btn.type='button';btn.dataset.value=option.value;btn.textContent=option.textContent;btn.setAttribute('role','option');menu.appendChild(btn);
      });
      trigger.addEventListener('click',event=>{event.preventDefault();menu.classList.contains('open')?close():open()});
      menu.addEventListener('pointerdown',event=>{if(event.pointerType&&event.pointerType!=='touch')return;startX=event.clientX;startY=event.clientY;moved=false},{passive:true});
      menu.addEventListener('pointermove',event=>{if(Math.abs(event.clientY-startY)>7||Math.abs(event.clientX-startX)>7)moved=true},{passive:true});
      menu.addEventListener('pointerup',()=>{if(moved)suppressClickUntil=performance.now()+450},{passive:true});
      menu.addEventListener('touchmove',()=>{moved=true},{passive:true});
      menu.addEventListener('click',event=>{
        const btn=event.target.closest('button[data-value]');if(!btn)return;
        if(moved||performance.now()<suppressClickUntil){event.preventDefault();event.stopPropagation();moved=false;return}
        select.value=btn.dataset.value;select.dispatchEvent(new Event('change',{bubbles:true}));sync();close();
      });
      document.addEventListener('pointerdown',event=>{if(!event.target.closest(`[data-select="${selectId}"]`))close()},{passive:true});
      sync();
    }

    async function checkHealth(){const status=$("status");try{const data=await fetch("/api/health",{cache:"no-store"}).then(r=>r.json());status.textContent=data&&data.ok?"en línea":"sin estado";status.className=data&&data.ok?"status ok":"status bad"}catch(error){status.textContent="sin conexión";status.className="status bad"}}
    function renderEmpty(message){$("results").innerHTML=`<div class="empty">${escapeHtml(message)}</div>`}
    function renderError(message){$("results").innerHTML=`<div class="error">${escapeHtml(message)}</div>`}
    function renderResults(items,payload){
      state.lastItems=items;const total=payload&&payload.total!==undefined?payload.total:items.length;
      $("summary").textContent=items.length?`${items.length} resultado(s) mostrados${total!==items.length?` de ${total}`:""}.`:"";
      if(!items.length){renderEmpty("No se encontraron resultados.");return}
      $("results").innerHTML=items.map((item,index)=>{
        const name=itemName(item),path=itemPath(item),category=itemCategory(item),page=itemPage(item),snippet=itemSnippet(item),ext=text(first(item,["extension","ext"],path?path.split(".").pop():""));
        return `<article class="result"><h2>${escapeHtml(name)}</h2><div class="meta">${category?`<span class="pill">${escapeHtml(category)}</span>`:""}${ext?`<span class="pill">${escapeHtml(ext)}</span>`:""}${page?`<span class="pill">pág. ${escapeHtml(page)}</span>`:""}</div>${snippet?`<p class="snippet">${escapeHtml(snippet)}</p>`:`<p class="snippet">Sin fragmento disponible.</p>`}<div class="actions"><button type="button" class="secondary" onclick="previewItem(${index})">Texto</button><button type="button" onclick="openFile(${index})">Abrir</button></div></article>`
      }).join("")
    }
    async function search(event){
      event.preventDefault();const query=$("query").value.trim();if(!query){renderEmpty("Escribí una búsqueda.");return}
      const btn=$("searchBtn");btn.disabled=true;btn.textContent="Buscando";$("summary").textContent="Consultando LexIA…";$("results").innerHTML="";
      try{const payload=await jsonFetch("/api/search",{method:"POST",body:JSON.stringify({query,category:$("category").value||null,limit:Number($("limit").value||20),semantic_fallback:true})});renderResults(normalizeItems(payload),payload)}
      catch(error){$("summary").textContent="";renderError(error.message||"No se pudo buscar.")}
      finally{btn.disabled=false;btn.textContent="Buscar"}
    }
    async function previewItem(index){const item=state.lastItems[index],path=itemPath(item),title=itemName(item);$("previewTitle").textContent=title;$("previewBody").textContent="Cargando vista previa…";$("preview").classList.add("open");$("preview").setAttribute("aria-hidden","false");try{const data=await jsonFetch("/api/navigator-preview",{method:"POST",body:JSON.stringify({path})});const doc=data.document||data;$("previewBody").textContent=doc.text||"LexIA no tiene texto de vista previa para este documento."}catch(error){const snippet=itemSnippet(item);$("previewBody").textContent=snippet||error.message||"No se pudo cargar la vista previa."}}
    function openFile(index){const item=state.lastItems[index],path=itemPath(item);if(!path)return;const url=`/api/file-preview?path=${encodeURIComponent(path)}`;window.open(url,"_blank","noopener,noreferrer")}
    function closePreview(){$("preview").classList.remove("open");$("preview").setAttribute("aria-hidden","true")}

    setupTouchSelect('category','categoryTrigger','categoryMenu');
    setupTouchSelect('limit','limitTrigger','limitMenu');
    $("searchForm").addEventListener("submit",search);
    $("closePreview").addEventListener("click",closePreview);
    $("preview").addEventListener("click",event=>{if(event.target===$("preview"))closePreview()});
    $("topBtn").addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
    $("desktopBtn").addEventListener("click",()=>{window.location.href="/"});
    $("healthBtn").addEventListener("click",async()=>{await checkHealth();alert($("status").textContent==="en línea"?"LexIA está en línea.":"No se pudo confirmar el estado de LexIA.")});
    checkHealth();renderEmpty("Ingresá una consulta para buscar en la biblioteca LexIA.");
  </script>
</body>
</html>
